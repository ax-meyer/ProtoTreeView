name: ProtoTreeViewBuildDeploy

on: [push, pull_request]
  
jobs:
  check_license:
    runs-on: windows-latest
    steps:
    - name: Setup python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
        architecture: 'x64'
        
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: true
        
    - name: Check license headers
      run: python manage_license_headers.py ci
    
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
              
    - name: Setup Dotnet sdk
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x
                        
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3.0.0
                  
    - name: Build Windows
      run: dotnet build --configuration Release .\ProtoTreeViewExample\ProtoTreeViewExample.csproj
        
  publish_nuget:
    needs: [check_license, build]
    if: startsWith(github.ref, 'refs/tags/v') # make sure deploy only runs on tags with version number
    runs-on: windows-latest
    # NuGet trusted publishing: the job's GitHub OIDC token is exchanged for a short-lived
    # nuget.org API key (policy on nuget.org: ax_meyer, this repo and workflow file).
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
              
    - name: Setup Dotnet sdk
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x
        
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3.0.0
                  
    - name: Build Windows
      run: dotnet build --configuration Release .\ProtoTreeView\ProtoTreeView.csproj
                  
    - name: Nuget Pack
      run: |
        $env:RELEASE_VERSION=($env:GITHUB_REF).split("tags/v")[-1]
        echo $env:RELEASE_VERSION
        echo $env:GITHUB_SHA
        mkdir nupkg
        dotnet pack -p:PackageVersion=$env:RELEASE_VERSION -o  $PWD\nupkg -p:RepositoryCommit=$env:GITHUB_SHA --configuration Release .\ProtoTreeView\ProtoTreeView.csproj

    # The key is valid for one hour, so it is requested right before the push.
    - name: NuGet login (OIDC to temporary API key)
      uses: NuGet/login@v1
      id: nuget_login
      with:
        user: ax_meyer

    - name: Nuget Deploy
      run: |
        cd nupkg
        dotnet nuget push "**/*.nupkg" --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" --no-symbols true

